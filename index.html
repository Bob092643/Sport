<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D5BB5">
<meta name="description" content="Thuistraining voor spierkracht, met voortgang en eiwittracker.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Krachthuis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
:root{
  --bg:#EDF0F3;--surface:#FFFFFF;--surface-2:#E2E7ED;--ink:#131A21;--ink-2:#46525F;--muted:#6F7B88;--line:#D2D9E1;
  --accent:#1D5BB5;--accent-ink:#FFFFFF;--accent-soft:#DAE6F7;--pr:#BF2F29;--good:#2B7A4B;--warn:#9A6414;--warn-soft:#FBEFD9;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;--nav-h:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0E1318;--surface:#161E27;--surface-2:#1F2A35;--ink:#E6EBF0;--ink-2:#A8B4C0;--muted:#7D8995;--line:#2A3542;
  --accent:#5C93E6;--accent-ink:#0A1220;--accent-soft:#1A2C46;--pr:#E8665F;--good:#58B881;--warn:#DDA64A;--warn-soft:#3A2D14;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0E1318;--surface:#161E27;--surface-2:#1F2A35;--ink:#E6EBF0;--ink-2:#A8B4C0;--muted:#7D8995;--line:#2A3542;
  --accent:#5C93E6;--accent-ink:#0A1220;--accent-soft:#1A2C46;--pr:#E8665F;--good:#58B881;--warn:#DDA64A;--warn-soft:#3A2D14;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:26px}h3{font-size:20px}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:14px}.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
header.top .wrap{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:22px;border-radius:2px;background:var(--accent);box-shadow:5px 0 0 -1px var(--pr)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:0;font-family:var(--body);cursor:pointer}
.chip.ok::before,.chip.late::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.chip.late{background:var(--warn-soft);color:var(--warn)}.chip.late::before{background:var(--warn)}
main{padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner strong{color:var(--warn)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button,.btn{font-family:var(--body);font-size:15px;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--pr);border-color:color-mix(in srgb,var(--pr) 45%,transparent)}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
button.block{width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
input,select,textarea{font-family:var(--body);font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%}
textarea{min-height:90px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
a{color:var(--accent)}

.plate{flex:none;width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-size:40px;font-weight:700;box-shadow:inset 0 0 0 6px color-mix(in srgb,var(--accent-ink) 18%,transparent),inset 0 0 0 26px var(--accent),inset 0 0 0 28px color-mix(in srgb,var(--accent-ink) 25%,transparent)}
.plate.B{background:var(--pr);box-shadow:inset 0 0 0 6px rgba(255,255,255,.18),inset 0 0 0 26px var(--pr),inset 0 0 0 28px rgba(255,255,255,.25)}
.plate.C{background:var(--good);box-shadow:inset 0 0 0 6px rgba(255,255,255,.18),inset 0 0 0 26px var(--good),inset 0 0 0 28px rgba(255,255,255,.25)}
.seg{display:flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border:0;background:transparent;color:var(--ink-2);padding:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exlist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.exlist li:first-child{border-top:0}
.exlist .t{font-weight:600}.exlist .s{color:var(--muted);font-size:14px;text-align:right;white-space:nowrap}
.week{display:flex;gap:6px}
.week span{width:28px;height:8px;border-radius:4px;background:var(--surface-2)}
.week span.on{background:var(--accent)}

.ex{gap:10px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-head h3{font-size:21px}
.tag{font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.hint{font-size:14px;color:var(--ink-2);background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:42px 1fr 16px 1fr 48px;gap:6px;align-items:center}
.set.bw{grid-template-columns:42px 1fr 48px}
.set .n{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.set .x{color:var(--muted);text-align:center}
.set input{text-align:center;font-variant-numeric:tabular-nums;padding-inline:4px}
.set .unit{position:relative}
.set .unit input{padding-right:26px}
.set .unit em{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--muted);pointer-events:none}
.tick{width:48px;height:44px;padding:0;border-radius:8px;font-size:20px;line-height:1}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.set.done input{border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;list-style:none;min-height:32px;display:flex;align-items:center}
details summary::-webkit-details-marker{display:none}
details ul{margin:6px 0 0;padding-left:20px;color:var(--ink-2);font-size:15px;display:flex;flex-direction:column;gap:4px}

.timer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:6;padding:8px 16px;background:var(--ink);color:var(--bg)}
.timer .wrap{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.timer .clock{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.timer button{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent);min-height:38px;padding:6px 12px}
.timer.over{background:var(--good);color:#fff}.timer.over button{color:#fff;border-color:rgba(255,255,255,.5)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{flex-direction:row;gap:0}
nav.tabs button{flex:1;border:0;border-radius:0;background:transparent;color:var(--muted);min-height:var(--nav-h);flex-direction:column;gap:2px;font-size:13px;padding:6px 2px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:12px;font-family:var(--body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .pt.last{fill:var(--pr)}
.chart .hit{fill:transparent;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-115%)}
.empty{color:var(--muted);font-size:15px;padding:18px;border:1px dashed var(--line);border-radius:8px;text-align:center}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.hist li:first-child{border-top:0}

.meter{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:7px;transition:width .3s}
.meter.full i{background:var(--good)}
.big{font-family:var(--display);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{min-height:40px;padding:6px 12px;font-weight:500;font-size:14px}
.quick button b{color:var(--accent);font-weight:700}
.eaten{list-style:none;margin:0;padding:0}
.eaten li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--line)}
.eaten li:first-child{border-top:0}
.eaten button{min-height:36px;padding:4px 10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.days div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.days .bar{width:100%;max-width:26px;height:70px;background:var(--surface-2);border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}
.days .bar i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.days .bar i.hit{background:var(--good)}
.meal{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.meal:first-of-type{border-top:0}
.meal .row{justify-content:space-between}
.meal b{font-weight:600}
ul.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
ul.tips strong{color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-2)}
.confirm{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (max-width:380px){.stats{grid-template-columns:1fr 1fr}.set{grid-template-columns:34px 1fr 12px 1fr 44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.set.tm{grid-template-columns:42px 1fr 48px 48px}
.tick.go{color:var(--accent);font-size:16px}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.check li{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.check li:first-child{border-top:0}
.check li.on span{color:var(--muted);text-decoration:line-through}
.check .box{width:40px;height:40px;min-height:40px;padding:0;border-radius:8px;color:var(--muted)}
.check .box[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.check .go{min-height:36px;padding:4px 10px;font-size:14px;color:var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.meter.kcal i{background:var(--ink-2)}
.meter.kcal.over i{background:var(--warn)}
.custom{display:grid;grid-template-columns:1fr 72px 72px 48px;gap:6px}
.custom button{padding:0}
.deload{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.deload .label{color:var(--good)}
button.inline{min-height:0;padding:0 4px;display:inline;font-size:inherit}
.timer.hold{background:var(--accent);color:var(--accent-ink)}
.timer.hold button{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-ink) 40%,transparent)}
@media (max-width:380px){.duo{grid-template-columns:1fr}.custom{grid-template-columns:1fr 60px 60px 44px}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--good);vertical-align:middle}
.dot.late{background:var(--warn)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:.04em;background:var(--surface-2);border-radius:8px;padding:10px 12px;word-break:break-all;user-select:all}
.keep{gap:8px;font-size:15px}
.keep input{width:20px;min-height:20px;height:20px}
.myf{display:inline-flex}
.myf button:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.myf .x{border-left:0;border-top-left-radius:0;border-bottom-left-radius:0;min-height:40px;padding:6px 10px;color:var(--muted)}
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <div class="brand"><i aria-hidden="true"></i>Krachthuis</div>
  <button class="chip" id="backupChip" type="button">Back-up</button>
</div></header>

<main><div class="wrap" id="view"></div></main>

<div class="timer" id="timer" hidden><div class="wrap">
  <div><div class="small" id="timerLabel">Rust</div><div class="clock" id="timerClock">0:00</div></div>
  <div class="row"><button type="button" id="timerPlus">+15 s</button><button type="button" id="timerStop">Klaar</button></div>
</div></div>

<nav class="tabs" aria-label="Onderdelen"><div class="wrap">
  <button type="button" data-tab="train"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Training</button>
  <button type="button" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Voortgang</button>
  <button type="button" data-tab="food"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 2-2 6 0 8v10"/></svg>Voeding</button>
  <button type="button" data-tab="more"><svg viewBox="0 0 24 24"><path stroke-width="4" d="M5 12h.01M12 12h.01M19 12h.01"/></svg>Meer</button>
</div></nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="firebase-config.js"></script>
<script>
(function(){
const KEY='krachthuis.v1';
const EX={
  bss:{name:'Bulgaarse split squat',kind:'db',sets:3,min:8,max:12,rest:90,side:true,cues:['Achterste voet op een stoel of bank, dumbbell in elke hand.','Zak recht naar beneden tot je achterste knie bijna de grond raakt.','Duw op door je voorste hiel; knie volgt de richting van je tenen.']},
  ohp:{name:'Overhead press',kind:'bar',sets:3,min:6,max:10,rest:120,cues:['Stang op schouderhoogte, handen net buiten de schouders.','Billen en buik aanspannen, geen holle rug.','Druk recht omhoog; hoofd even naar achter, daarna onder de stang door.']},
  pullup:{name:'Pull-ups',kind:'bw',load:true,sets:3,min:5,max:12,rest:120,cues:['Bovenhandse greep, iets breder dan de schouders.','Trek je borst naar de stang, schouderbladen naar beneden.','Lukt nog geen 5? Wissel naar negatieve pull-ups.']},
  bbrow:{name:'Voorovergebogen roeien',kind:'bar',sets:3,min:8,max:12,rest:90,cues:['Heupen naar achter, rug recht, bovenlichaam ongeveer 45°.','Trek de stang naar je navel, ellebogen langs je lichaam.','Gecontroleerd laten zakken, niet zwaaien.']},
  pushup:{name:'Push-ups',kind:'bw',load:true,sets:3,min:8,max:20,rest:60,cues:['Handen iets breder dan de schouders, lichaam één rechte lijn.','Borst bijna tot de grond, ellebogen ongeveer 45° van je lichaam.','Te makkelijk? Voeten op een stoel.']},
  plank:{name:'Plank',kind:'time',sets:3,min:30,max:60,rest:60,cues:['Op onderarmen, ellebogen onder de schouders.','Billen aanspannen en navel naar binnen.','Stop zodra je heupen gaan zakken.']},
  rdl:{name:'Roemeense deadlift',kind:'bar',sets:3,min:8,max:10,rest:120,cues:['Knieën licht gebogen, stang dicht langs je benen.','Heupen naar achter tot je een flinke rek in je hamstrings voelt.','Rug blijft recht; kom omhoog door je heupen naar voren te duwen.']},
  floor:{name:'Floor press',kind:'bar',sets:3,min:6,max:10,rest:120,cues:['Liggend op de grond, knieën gebogen, stang boven je borst.','Zak tot je bovenarmen de grond raken, even stil, dan omhoog.','Een bankdrukken zonder bank: sparend voor de schouders.']},
  chinup:{name:'Chin-ups',kind:'bw',load:true,sets:3,min:5,max:12,rest:120,cues:['Onderhandse greep op schouderbreedte.','Kin boven de stang, gecontroleerd terug tot gestrekte armen.','Meer biceps dan bij pull-ups.']},
  dbrow:{name:'Eenarmig roeien',kind:'db',sets:3,min:10,max:15,rest:75,side:true,cues:['Eén hand en knie op een stoel of bank, rug plat.','Trek de dumbbell naar je heup.','Onderaan even goed uitstrekken.']},
  lunge:{name:'Walking lunges',kind:'db',sets:2,min:10,max:16,rest:90,cues:['Dumbbells naast je lichaam, grote stap vooruit.','Achterste knie bijna tot de grond.','Aantal = totaal aantal stappen.']},
  knee:{name:'Hangend knieheffen',kind:'bw',sets:3,min:8,max:15,rest:60,cues:['Hang aan de stang, schouders actief.','Trek je knieën naar je borst en kantel je bekken.','Niet zwaaien; te makkelijk? Gestrekte benen.']},
  dl:{name:'Deadlift',kind:'bar',sets:3,min:5,max:8,rest:150,cues:['Stang boven het midden van je voeten, schenen tegen de stang.','Borst op, rug recht, stang dicht bij je lichaam.','Duw de vloer weg; bovenaan rechtop staan, niet achterover hangen.']},
  goblet:{name:'Goblet squat (3 tellen omlaag)',kind:'db',sets:3,min:12,max:20,rest:90,cues:['Eén dumbbell rechtop tegen je borst.','Zak in 3 tellen zo diep als je netjes kunt.','Ellebogen tussen je knieën, borst omhoog.']},

    let bin='';for(let i=0;i<buf.length;i+=32768)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+32768));return'gz:'+btoa(bin)}catch(e){return j}

async function plain(r){

  const bin=atob(r.data.slice(3)),u=Uint8Array.from(bin,c=>c.charCodeAt(0));

function chartSVG(pts,unit){
  if(pts.length<2)return`<div class="empty">${pts.length?'Na je volgende meting verschijnt hier een lijn.':'Nog geen gegevens.'}</div>`;
  const W=600,H=220,pl=44,pr=16,pt=14,pb=28;
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1}
  const pad=(mx-mn)*.15;mn=Math.max(0,mn-pad);mx+=pad;
  const nice=(mx-mn)/3,step=Math.pow(10,Math.floor(Math.log10(nice)));const st=[1,2,2.5,5,10].map(m=>m*step).find(s=>s>=nice)||nice;
  mn=Math.floor(mn/st)*st;mx=Math.ceil(mx/st)*st;
  const X=i=>pl+(W-pl-pr)*(i/(pts.length-1)),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let g='';for(let v=mn;v<=mx+1e-9;v+=st){g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl-8}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`}
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=d+` L${X(pts.length-1)} ${H-pb} L${pl} ${H-pb} Z`;
  const n=pts.length,li=n<=4?[...Array(n).keys()]:[0,Math.round((n-1)/3),Math.round(2*(n-1)/3),n-1];
  const lab=li.map((i,j)=>`<text class="ax" x="${X(i)}" y="${H-8}" text-anchor="${j===0?'start':j===li.length-1?'end':'middle'}">${esc(pts[i].x)}</text>`).join('');
  const dots=pts.map((p,i)=>`<circle class="pt ${i===pts.length-1?'last':''}" cx="${X(i)}" cy="${Y(p.y)}" r="${i===pts.length-1?5.5:4}"/>`).join('');
  const bw=(W-pl-pr)/(pts.length-1);
  const hits=pts.map((p,i)=>`<rect class="hit" x="${X(i)-bw/2}" y="0" width="${bw}" height="${H}" data-tip="${esc(p.x)}: ${fmt(p.y)}${unit}" data-cx="${X(i)/W}" data-cy="${Y(p.y)/H}"/>`).join('');
  return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verloop">${g}<path class="ar" d="${area}"/><path class="ln" d="${d}"/>${dots}${lab}${hits}</svg><div class="tip" hidden></div></div>`;
}

    ${confirmKey==='wipe'?`<div class="confirm"><b>Alle trainingen, gewichten en voedingsgegevens wissen?</b><span class="small muted">Dit kan niet ongedaan worden gemaakt, tenzij je een back-up hebt.</span>${M.code?`<span class="small"><b>Noteer je code, anders kun je je cloudgegevens niet terughalen.</b></span><div class="code num">${prettyCode(M.code)}</div><button type="button" data-act="cloud-copy">Kopieer code</button>`:''}<div class="row"><button type="button" class="danger" data-act="wipe-yes">Alles wissen</button><button type="button" data-act="cancel">Annuleren</button></div></div>`:`<button type="button" class="danger" data-act="wipe">Alles wissen</button>`}
  </section>`;
}

function render(){
  $('#view').innerHTML=tab==='train'?vTrain():tab==='progress'?vProgress():tab==='food'?vFood():vMore();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  renderChip();
  if(!storageOk)toast('Opslaan lukt niet in deze browser. Maak een back-up.');
  syncWake();
}
function go(t){tab=t;confirmKey=null;swapOpen=null;render();window.scrollTo(0,0)}

function runSeq(steps,onDone){const go=i=>{if(i>=steps.length){if(onDone)onDone();return}const st=steps[i];runTimer('hold',st[0],st[1],()=>go(i+1))};go(0)}
function sideSteps(sec,label){return[[sec,label+' · kant 1'],[5,'Wissel van kant'],[sec,label+' · kant 2']]}
function runTimer(mode,sec,label,onDone){
  timer.mode=mode;timer.end=Date.now()+sec*1000;timer.onDone=onDone||null;
  const t=$('#timer');t.hidden=false;t.classList.remove('over');t.classList.toggle('hold',mode==='hold');
  $('#timerLabel').textContent=label;$('#timerPlus').hidden=mode==='hold';
  tickTimer();clearInterval(timer.iv);timer.iv=setInterval(tickTimer,250);
}
let actx=null;
function unlockAudio(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){if(!S.settings.sound||!actx)return;try{const t0=actx.currentTime;[0,.22,.44].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=i===2?1320:880;g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.35,t0+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.18);o.connect(g);g.connect(actx.destination);o.start(t0+d);o.stop(t0+d+.2)})}catch(e){}}
function buzz(){beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
let wake=null;
async function syncWake(){const want=!!(S.draft&&!S.draft.editId)&&document.visibilityState==='visible';
  try{if(want&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}
  else if(!want&&wake){const w=wake;wake=null;await w.release()}}catch(e){wake=null}}
document.addEventListener('visibilitychange',()=>{syncWake();if(document.visibilityState==='visible'&&timer.mode)tickTimer()});
function tickTimer(){
  const left=Math.ceil((timer.end-Date.now())/1000),t=$('#timer'),a=Math.abs(left);
  $('#timerClock').textContent=(left<0?'+':'')+Math.floor(a/60)+':'+String(a%60).padStart(2,'0');
  if(left<=0&&timer.mode==='hold'){const f=timer.onDone;timer.onDone=null;buzz();stopTimer();if(f)f();return}
  if(left<=0&&!t.classList.contains('over')){t.classList.add('over');$('#timerLabel').textContent=timer.mode==='next'?$('#timerLabel').textContent.replace('Rust · ',''):'Volgende set';buzz()}
}
function stopTimer(){clearInterval(timer.iv);timer.mode=null;$('#timer').hidden=true;$('#timer').classList.remove('over','hold')}
function afterSet(id){
  const D=S.draft,rows=D.entries[id],ix=D.slots.findIndex(s=>s.cur===id);
  if(rows.every(s=>s.done)){
    const nx=D.slots[ix+1];
    if(nx)runTimer('next',EX[nx.cur].rest>=120?120:90,'Rust · Naar: '+EX[nx.cur].name);
    else{stopTimer();toast('Laatste oefening klaar. Tijd voor afkoelen en rekken.')}
  }else runTimer('rest',EX[id].rest,'Rust · '+EX[id].name);
}

function payload(){return JSON.stringify({app:'krachthuis',exported:new Date().toISOString(),data:Object.assign({},S,{draft:null})},null,1)}
function markBackup(msg){S.lastBackup=Date.now();save();render();toast(msg)}
let bkMsg='';
function askMark(msg){bkMsg=msg;tab='more';confirmKey='bk';render();const c=document.getElementById('bkConfirm');if(c)c.scrollIntoView({block:'center'})}
async function doBackup(){
  const name='krachthuis-backup-'+todayKey()+'.txt';
  const file=new File([payload()],name,{type:'text/plain'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Krachthuis back-up'});markBackup('Back-up gedeeld.');return}
    catch(e){if(e&&e.name==='AbortError'){toast('Back-up niet gedeeld.');return}}
  }
  doDownload();
}
function doDownload(){
  try{const name='krachthuis-backup-'+todayKey()+'.txt',url=URL.createObjectURL(new Blob([payload()],{type:'text/plain'}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
    askMark('Het back-upbestand staat nu in je Downloads-map, alleen op deze telefoon.')}
  catch(e){tab='more';render();showCopy();toast('Downloaden lukt niet. Kopieer de tekst.')}
}
function showCopy(){const b=$('#copyBox');if(!b)return;b.hidden=false;b.value=payload();b.focus();b.select()}
async function doCopy(){
  try{await navigator.clipboard.writeText(payload());askMark('De back-up is gekopieerd. Plak hem in een notitie of mail aan jezelf.')}
  catch(e){showCopy();toast('Selecteer de tekst en kopieer hem zelf.')}
}
function bad(msg){const e=new Error(msg);e.user=true;return e}
const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
const isDate=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x);
const isNum=x=>typeof x==='number'&&isFinite(x);
function validData(d){
  if(!isObj(d))throw bad('Dit is geen geldige Krachthuis-back-up.');
  if((d.v||1)>1)throw bad('Deze back-up komt uit een nieuwere versie van de app. Werk de app eerst bij.');
  if(d.settings!==undefined&&!isObj(d.settings))throw bad('De instellingen in dit bestand zijn ongeldig.');
  if(!Array.isArray(d.sessions))throw bad('Er staan geen trainingen in dit bestand.');
  d.sessions.forEach((x,i)=>{
    const ok=isObj(x)&&typeof x.id==='string'&&isDate(x.date)&&WO[x.workout]&&isNum(x.ts)&&Array.isArray(x.entries)
      &&x.entries.every(en=>isObj(en)&&EX[en.ex]&&Array.isArray(en.sets)&&en.sets.every(st=>isObj(st)&&isNum(+st.r)));
    if(!ok)throw bad(`Training ${i+1} in dit bestand is beschadigd.`);
  });
  if(d.weights!==undefined&&!(Array.isArray(d.weights)&&d.weights.every(w=>isObj(w)&&isDate(w.date)&&isNum(w.kg))))throw bad('De gewichtsmetingen in dit bestand zijn ongeldig.');
  if(d.protein!==undefined&&!(isObj(d.protein)&&Object.entries(d.protein).every(([k,v])=>isDate(k)&&Array.isArray(v)&&v.every(it=>isObj(it)&&isNum(it.g)))))throw bad('De voedingsgegevens in dit bestand zijn ongeldig.');
  const sw={};if(isObj(d.swaps))Object.entries(d.swaps).forEach(([o,n])=>{if(EX[o]&&EX[n])sw[o]=n});
  const ext={};if(isObj(d.extra))Object.entries(d.extra).forEach(([w,l])=>{if(WO[w]&&Array.isArray(l))ext[w]=l.filter(x=>EX[x])});
  const mf=Array.isArray(d.myFoods)?d.myFoods.filter(f=>isObj(f)&&typeof f.l==='string'&&isNum(f.g)).slice(0,8):[];
  const n=normalize(Object.assign({},d,{swaps:sw,extra:ext,myFoods:mf,draft:null}));
  if(!isObj(n.deload))n.deload=def().deload;
  return n;
}
function parseBackup(txt){let o;try{o=JSON.parse(txt)}catch(e){throw bad('Dit is geen geldige Krachthuis-back-up.')}
  if(!isObj(o)||o.app!=='krachthuis'||!isObj(o.data))throw bad('Dit is geen Krachthuis-back-up.');
  return validData(o.data)}
async function checkRestore(){
  const f=$('#restoreFile').files[0];let txt=$('#restoreText').value.trim();
  if(f)txt=await f.text();
  if(!txt){toast('Kies eerst een bestand of plak de tekst.');return}
  try{const d=parseBackup(txt);restorePending={d,summary:`Back-up met ${d.sessions.length} trainingen en ${(d.weights||[]).length} gewichtsmetingen gevonden.`};confirmKey='restore';render()}
  catch(e){toast(e&&e.user?e.message:'Dit is geen geldige Krachthuis-back-up.')}
}
function finishDraft(){
  const D=S.draft,entries=[];
  D.slots.forEach(sl=>{const sets=(D.entries[sl.cur]||[]).filter(s=>s.done).map(s=>({w:usesW(sl.cur)?(num(s.w)??''):'',r:num(s.r)||0}));if(sets.length)entries.push({ex:sl.cur,sets})});
  if(!entries.length){toast('Vink eerst de sets aan die je hebt gedaan.');return}
  if(D.editId){const s=S.sessions.find(x=>x.id===D.editId);if(s)s.entries=entries
    S.draft=null;save();stopTimer();tab='progress';render();window.scrollTo(0,0);toast('Training bijgewerkt.');return}
  const topW=sets=>Math.max(...sets.map(x=>+x.w||0));
  const prs=D.deload?[]:entries.filter(en=>{if(!usesW(en.ex)||!(topW(en.sets)>0))return false;const prev=S.sessions.filter(s=>!s.deload).flatMap(s=>s.entries.filter(x=>x.ex===en.ex&&x.sets.length).map(x=>topW(x.sets)));return prev.length&&topW(en.sets)>Math.max(...prev)}).map(en=>`${EX[en.ex].name} (${hasLoad(en.ex)?'+':''}${fmt(topW(en.sets))} kg)`);
  S.sessions.push(Object.assign({id:Date.now().toString(36),ts:Date.now(),date:D.date,workout:D.workout,entries,deload:!!D.deload},D.easy?{easy:true}:{}));if(D.easy)S.easy=false;
  S.draft=null;save();stopTimer();tab='train';render();window.scrollTo(0,0);
  toast(prs.length?'Opgeslagen. Nieuw record: '+prs.join(', '):'Training opgeslagen.');
}

document.addEventListener('click',e=>{
  const nb=e.target.closest('nav.tabs button');if(nb){go(nb.dataset.tab);return}
  if(e.target.closest('#backupChip')){go('more');return}
  if(e.target.closest('#timerStop')){stopTimer();return}
  if(e.target.closest('#timerPlus')){timer.end+=15000;$('#timer').classList.remove('over');tickTimer();return}
  unlockAudio();
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.ex,i=+b.dataset.i;
  switch(a){
    case'pick':pickWo=b.dataset.w;render();break;
    case'start':{pickOpen=false;const w=b.dataset.w,slots=buildSlots(w),ent={};slots.forEach(sl=>ent[sl.cur]=freshRows(sl.cur));
      S.draft={workout:w,date:todayKey(),started:Date.now(),slots,entries:ent,warm:{},cool:{},deload:isLight(),easy:!isDeload()&&!!S.easy};pickWo=null;save();render();window.scrollTo(0,0);break}
    case'tick':{const s=S.draft.entries[id][i];s.done=!s.done;save();render();if(s.done&&!S.draft.editId)afterSet(id);break}
    case'hold':{const s=S.draft.entries[id][i],sec=num(s.r)||EX[id].min,lb='Vasthouden · '+EX[id].name+' · set '+(i+1);runSeq(EX[id].side?sideSteps(sec,lb):[[sec,lb]],()=>{if(!S.draft||!S.draft.entries[id]||!S.draft.entries[id][i])return;S.draft.entries[id][i].done=true;save();render();afterSet(id)});break}
    case'chk':{const k=b.dataset.k,st=S.draft[k]=S.draft[k]||{};st[i]=!st[i];save();render();break}
    case'chktimer':{const k=b.dataset.k,list=k==='warm'?WARM:COOL,it=list[i];runSeq(/per (been|kant)/.test(it[0])?sideSteps(it[1],it[0]):[[it[1],it[0]]],()=>{if(!S.draft)return;(S.draft[k]=S.draft[k]||{})[i]=true;save();render()});break}
    case'addset':{const arr=S.draft.entries[id],l=arr[arr.length-1]||{w:'',r:EX[id].min};arr.push({w:l.w,r:l.r,done:false});save();render();break}
    case'swap':swapOpen=+b.dataset.slot;render();document.getElementById('ex-'+S.draft.slots[swapOpen].cur).scrollIntoView({block:'nearest'});break;
    case'swapclose':swapOpen=null;render();break;
    case'swapto':{const D=S.draft,sl=D.slots[+b.dataset.slot],to=b.dataset.to;delete D.entries[sl.cur];sl.cur=to;D.entries[to]=freshRows(to);
      if(to===sl.orig)delete S.swaps[sl.orig];else S.swaps[sl.orig]=to;swapOpen=null;save();render();toast(`${EX[to].name} staat nu in training ${D.workout}.`);break}
    case'pick-open':pickOpen=true;pickKeep=false;render();document.getElementById('picker').scrollIntoView({block:'start'});break;
    case'pick-close':pickOpen=false;render();break;
    case'pick-add':{const D=S.draft,x=id;if(D.slots.some(o=>o.cur===x))break;D.slots.push({orig:x,cur:x,extra:true});D.entries[x]=freshRows(x);
      if(pickKeep){const l=(S.extra[D.workout]=S.extra[D.workout]||[]);if(!l.includes(x))l.push(x)}
      pickOpen=false;save();render();document.getElementById('ex-'+x).scrollIntoView({block:'start'});toast(pickKeep?`${EX[x].name} staat nu vast in training ${D.workout}.`:`${EX[x].name} toegevoegd aan deze training.`);break}
    case'rmslot':{const D=S.draft,sl=D.slots[+b.dataset.slot];if(!sl)break;D.slots.splice(+b.dataset.slot,1);delete D.entries[sl.cur];save();render();
      toast(((S.extra[D.workout]||[]).includes(sl.cur))?'Verwijderd uit deze training. Hij staat nog vast in het schema; haal hem weg onder Meer.':'Verwijderd uit deze training.');break}
    case'unextra':{const l=S.extra[b.dataset.w]||[];S.extra[b.dataset.w]=l.filter(x=>x!==b.dataset.o);save();render();break}
    case'unswap':delete S.swaps[b.dataset.o];save();render();break;
    case'finish':finishDraft();break;
    case'discard':confirmKey='discard';render();break;
    case'easy-yes':{const l=S.sessions[S.sessions.length-1];S.easy=true;S.gapAck=l&&l.id;save();render();break}
    case'easy-no':{const l=S.sessions[S.sessions.length-1];S.gapAck=l&&l.id;save();render();break}
    case'myfood':{const f=S.myFoods[i];if(!f)break;const k=todayKey();(S.protein[k]=S.protein[k]||[]).push({l:f.l,g:f.g,k:f.k});save();render();break}
    case'myfood-del':S.myFoods.splice(i,1);save();render();break;
    case'sug-yes':{const sg=suggest(id),D=S.draft;(D.sug=D.sug||{})[id]='yes';D.entries[id].forEach(r=>{if(!r.done){r.w=sg.up.w;r.r=sg.up.r}});save();render();break}
    case'sug-no':{(S.draft.sug=S.draft.sug||{})[id]='no';save();render();break}
    case'sound':S.settings.sound=!S.settings.sound;save();render();if(S.settings.sound){unlockAudio();beep()}break;
    case'discard-yes':{const ed=S.draft&&S.draft.editId;S.draft=null;confirmKey=null;save();stopTimer();tab=ed?'progress':'train';render();break}
    case'cancel':confirmKey=null;restorePending=null;cloudPending=null;render();break;
    case'edit':{if(S.draft){toast('Rond eerst je lopende training af.');break}
      const s=S.sessions.find(x=>x.id===b.dataset.id);if(!s)break;const ent={};s.entries.forEach(en=>ent[en.ex]=en.sets.map(x=>({w:x.w,r:x.r,done:true})));
      S.draft={workout:s.workout,date:s.date,editId:s.id,slots:s.entries.map(en=>({orig:en.ex,cur:en.ex})),entries:ent,deload:!!s.deload};save();tab='train';render();window.scrollTo(0,0);break}
    case'del':confirmKey='del-'+b.dataset.id;render();break;
    case'del-yes':S.sessions=S.sessions.filter(s=>s.id!==b.dataset.id);confirmKey=null;save();render();toast('Training verwijderd.');break;
    case'addbw':{const v=num($('#bwIn').value);if(!(v>30&&v<300)){toast('Vul je gewicht in kilo in.');break}
      const k=todayKey();S.weights=S.weights.filter(w=>w.date!==k);S.weights.push({date:k,kg:v});S.weights.sort((x,y)=>x.date<y.date?-1:1);S.settings.bw=v;save();render();toast('Gewicht opgeslagen.');break}
    case'setbw':{const v=num($('#bwSet').value);if(!(v>30&&v<300)){toast('Vul je gewicht in kilo in.');break}S.settings.bw=v;save();render();break}
    case'gomore':go('more');break;
    case'food':{const f=FOODS[i],k=todayKey();(S.protein[k]=S.protein[k]||[]).push({l:f[0],g:f[1],k:f[2]});save();render();break}
    case'foodc':{const g=parseInt($('#fG').value,10)||0,kc=parseInt($('#fK').value,10)||0;if(!(g>0||kc>0)){toast('Vul gram eiwit of kcal in.');break}
      const nm=$('#fName').value.trim(),k=todayKey();(S.protein[k]=S.protein[k]||[]).push({l:nm||'Eigen invoer',g,k:kc});
      if(nm){S.myFoods=(S.myFoods||[]).filter(f=>f.l.toLowerCase()!==nm.toLowerCase());S.myFoods.unshift({l:nm,g,k:kc});S.myFoods=S.myFoods.slice(0,8)}save();render();break}
    case'fdel':{const k=todayKey();S.protein[k].splice(i,1);if(!S.protein[k].length)delete S.protein[k];save();render();break}
    case'backup':doBackup();break;
    case'download':doDownload();break;
    case'copy':doCopy();break;
    case'restore':checkRestore();break;
    case'restore-yes':S=restorePending.d;S.draft=null;S.lastBackup=Date.now();restorePending=null;confirmKey=null;save();render();toast('Back-up teruggezet.');break;
    case'savesettings':{const st=S.settings,p=x=>{const v=num($('#s-'+x).value);return v&&v>0?v:null};
      st.bw=p('bw');st.height=p('height');st.age=p('age');st.sex=$('#s-sex').value;st.act=+$('#s-act').value;
      ['maxBar','maxDb','barInc','dbInc'].forEach(x=>{const v=p(x);if(v)st[x]=v});save();render();toast('Opgeslagen.');break}
    case'deload-start':startDeload();render();toast('Rustweek gestart.');break;
    case'deload-snooze':S.deload.snooze=addDays(todayKey(),7);save();render();break;
    case'deload-stop':S.deload.until=null;S.deload.lastEnd=todayKey();save();render();break;
    case'wipe':confirmKey='wipe';render();break;
    case'wipe-yes':{const was=!!M.code;if(M.code){M.enabled=false;clearTimeout(pushT)}saveMeta();S=def();confirmKey=null;save();stopTimer();render();toast(was?'Alles gewist op dit apparaat. De cloudgegevens blijven bewaard.':'Alles gewist.');break}
    case'cloud-resume':cloudResume();break;
    case'resume-remote':resumeRemote();break;
    case'resume-local':resumeLocal();break;
    case'cloud-forget':M={};saveMeta();showCode=false;render();break;
    case'bk-mark':confirmKey=null;markBackup('Gemarkeerd als back-up.');break;
    case'cloud-on':cloudEnable();break;
    case'cloud-check':cloudCheck();break;
    case'cloud-connect':cloudConnect();break;
    case'cloud-show':showCode=!showCode;render();break;
    case'cloud-copy':{const c=prettyCode(M.code);navigator.clipboard.writeText(c).then(()=>toast('Code gekopieerd.'),()=>{showCode=true;render();toast('Selecteer de code en kopieer hem zelf.')});break}
    case'cloud-off':confirmKey='cloud-off';render();break;
    case'cloud-off-yes':cloudOff();break;
    case'cloud-del':confirmKey='cloud-del';render();break;
    case'cloud-del-yes':cloudDelete();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;if(!S.draft)return;
  if(t.dataset&&t.dataset.f){const s=S.draft.entries[t.dataset.ex][+t.dataset.i];s[t.dataset.f]=t.value.replace(',','.');save()}
});
document.addEventListener('change',e=>{if(e.target.id==='pickKeep'){pickKeep=e.target.checked;return}if(e.target.id==='exSel'){chartEx=e.target.value;render()}});
function showTip(r){const c=r.closest('.chart'),tip=c.querySelector('.tip'),svg=c.querySelector('svg').getBoundingClientRect();
  tip.textContent=r.dataset.tip;tip.hidden=false;tip.style.left=(+r.dataset.cx*svg.width)+'px';tip.style.top=(+r.dataset.cy*svg.height)+'px'}
document.addEventListener('pointerover',e=>{const r=e.target.closest('.hit');if(r)showTip(r)});
document.addEventListener('pointerout',e=>{const r=e.target.closest('.hit');if(r)r.closest('.chart').querySelector('.tip').hidden=true});
document.addEventListener('pointerdown',e=>{const r=e.target.closest('.hit');if(r)showTip(r)});

if(S.draft&&!S.draft.slots){const w=S.draft.workout;S.draft.slots=Object.keys(S.draft.entries).map(x=>({orig:x,cur:x}));if(!WO[w])S.draft=null}
if(compactFood())save();
render();
pull();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;if(compactFood())save();if(cloudOn())M.dirty?push():pull()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
